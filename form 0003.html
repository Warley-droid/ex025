<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/logo.ico.ico" type="image/x-icon">
    <title>Formulário 003</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <form action="formulario.js" method="get" autocomplete="on">
        <p>
            <label for="inome"> Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" size="15" placeholder="Nome completo" autocomplete="name">
        </p>

        <p>
            <label for="inota">Nota</label>
            <input type="number" name="nota" id="inota" required min="0" max="10" size="4" placeholder="Nota" autocomplete="0 a 10" step="0.5">
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" nome="mes" id="imes" value="2026-08">
        </p>

        <p>
            <label for="idia">Dia da Prova</label>
            <input type="date" name="dia" id="idia" value="2026-08-13">
        </p>

        <p>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora" value="14:30">
        </p>

        <p>
            <input type="reset" value="Resetar">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
