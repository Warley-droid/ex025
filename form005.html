<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/ilustracao-300.JPG.jpg" type="image/x-icon">
    <title>Formulário 005</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="formulario.js" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <p>
                <label for="sximas">Masculino</label>
                <input type="radio" name="sexo" id="sximas" value="M" checked>
            </p>
            <label for="sxifem">Feminino</label>
            <input type="radio" name="sexo" id="sxifem" value="F">
            <p>
                
            </p>
        </fieldset>

        <fieldset>
            <legend>Esportes Favoritos</legend>
            <p>
                <label for="ifut">Futebol</label>
                <input type="checkbox" name="fut" id="ifut">
            </p>

            <p>
                <label for="ibas">Basquete</label>
                <input type="checkbox" name="bas" id="ibas">
            </p>

            <p>
                <label for="inat">Natação</label>
                <input type="checkbox" name="nat" id="inat">
            </p>

            <p>
                <label for="iten">Tênis</label>
                <input type="checkbox" name="ten" id="iten">
            </p>
        </fieldset>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
