<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/logo.ico.ico" type="image/x-icon">
    <title>Formulário 004</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="formulario.js" method="get" autocomplete="on">

        <legend>Dados pessoais</legend>

        <fildset>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" id="iemail" name="email" autocomplete="email"
                required>
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel"
                pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
            <p>
                <input type="reset" value="Resetar">
                <input type="submit" value="Enviar">
            </p>
        </fildset>
    </form>
</body>
</html>
